

name: Build Pashto Keyboard APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: flutter create --platforms=android --project-name pashto_keyboard app

      - name: Copy Pashto Keyboard Files
        run: |
          cp lib/main.dart app/lib/main.dart

          mkdir -p app/android/app/src/main/kotlin/com/example/pashto_keyboard
          cp android/app/src/main/kotlin/com/example/pashto_keyboard/*.kt app/android/app/src/main/kotlin/com/example/pashto_keyboard/

          mkdir -p app/android/app/src/main/res/xml
          cp android/app/src/main/res/xml/method.xml app/android/app/src/main/res/xml/method.xml

      - name: Register Keyboard Service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          service = """
              <service
                  android:name=".PashtoInputMethodService"
                  android:label="Pashto Keyboard"
                  android:permission="android.permission.BIND_INPUT_METHOD"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.view.InputMethod"/>
                  </intent-filter>
                  <meta-data
                      android:name="android.view.im"
                      android:resource="@xml/method"/>
              </service>
          """

          if "PashtoInputMethodService" not in s:
              s = s.replace("</application>", service + "\n</application>")

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashto-Keyboard-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
